spring.application.name=finance-ai-api
server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.property-naming-strategy=SNAKE_CASE

# ==================================================
# Servicio de AI (srv-python)
# ==================================================
# En local: http://localhost:8000
# En docker-compose: http://ml-service:8000 (inyectado por la variable de entorno)
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# Ponlo en false para forzar el modo degradado (reglas locales) sin apagar Python.
# Util para desarrollar el frontend sin levantar el ml-service.
ml.service.enabled=${ML_SERVICE_ENABLED:true}

# Sin timeouts, si el ml-service se cuelga la API se cuelga con el.
ml.service.connect-timeout=1s
ml.service.read-timeout=2s

# Por debajo de esta confianza la categoria del modelo se degrada a "otras".
ml.service.confianza-minima=0.5

# ==================================================
# OCI Object Storage
# ==================================================
# El backend archiva cada analisis como un objeto JSON, para poder seguir la
# evolucion financiera en el tiempo.
#
# Se accede con una Pre-Authenticated Request (PAR): una URL firmada con
# caducidad, sin credenciales en el contenedor. Como generarla: docs/OCI.md
#
# Sin OCI_PAR_URL el archivado se omite y la API funciona igual.
oci.par-url=${OCI_PAR_URL:}
oci.bucket=${OCI_BUCKET:finance-ai-models}
oci.namespace=${OCI_NAMESPACE:}
oci.region=${OCI_REGION:}
oci.prefijo=${OCI_PREFIJO:historial}
oci.historial-habilitado=${OCI_HISTORIAL:true}

# ==================================================
# CORS (frontend)
# ==================================================
# 5173 = Vite, 3000 = Next/CRA. Agrega aqui el origen de produccion cuando lo tengas.
# 5173 = Vite, 3000 = Next/CRA, 8081 = el frontend estatico de web/ en docker-compose.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}

# ==================================================
# Logging
# ==================================================
logging.level.com.financeai.api.integration=INFO
