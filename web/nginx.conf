# Nginx sirve el frontend estatico y hace de proxy hacia el backend Java.
#
# Con el proxy no hay CORS: para la pagina, /api/v1 es el mismo origen. Ademas
# deja una sola puerta de entrada, igual que en un despliegue en OCI Compute.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # "api" es el nombre del servicio en compose; dentro de la red, cada
        # contenedor tiene su propio localhost.
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;

        # Se borra el Origin antes de pasar la peticion a la API.
        #
        # El navegador lo envia en los POST aunque sean del mismo origen, y la
        # API lo compara contra app.cors.allowed-origins: si el sitio se sirve
        # desde una IP o un dominio que no estan en esa lista, responde 403.
        # Como aqui el frontend y la API comparten origen a ojos del navegador,
        # quitarlo hace que la API la trate como una peticion normal y el
        # despliegue funcione con cualquier IP o dominio sin reconfigurar nada.
        #
        # Esto no relaja el CORS de quien llame a la API directamente al 8080:
        # ese trafico no pasa por aqui.
        proxy_set_header Origin "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El primer analisis puede tardar: el ml-service carga los artefactos
        # y, con OCI configurado, los descarga antes.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # El chat n8n queda bajo el mismo origen que el frontend: no requiere CORS.
    #
    # El upstream va en una variable a proposito. Con un nombre literal, nginx
    # lo resuelve al arrancar y, si el contenedor de n8n no esta, se niega a
    # levantar y tumba tambien el frontend. Con variable resuelve en cada
    # peticion usando el DNS de Docker (127.0.0.11), asi que sin n8n solo falla
    # /n8n/ con un 502 y el resto sigue funcionando.
    #
    # El rewrite hace falta porque al usar variable nginx ya no sustituye solo
    # el prefijo de la location: /n8n/webhook/x tiene que llegar como /webhook/x.
    location /n8n/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $n8n_upstream n8n-n8n-1:5678;
        rewrite ^/n8n/(.*)$ /$1 break;
        proxy_pass http://$n8n_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Swagger, para poder abrir la documentacion desde el mismo host.
    location ~ ^/(swagger-ui|api-docs) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
