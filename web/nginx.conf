# Nginx sirve el frontend estatico y hace de proxy hacia el backend Java.
#
# Con el proxy no hay CORS: para la pagina, /api/v1 es el mismo origen. Ademas
# deja una sola puerta de entrada, igual que en un despliegue en OCI Compute.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # "api" es el nombre del servicio en compose; dentro de la red, cada
        # contenedor tiene su propio localhost.
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El primer analisis puede tardar: el ml-service carga los artefactos
        # y, con OCI configurado, los descarga antes.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Swagger, para poder abrir la documentacion desde el mismo host.
    location ~ ^/(swagger-ui|api-docs) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
