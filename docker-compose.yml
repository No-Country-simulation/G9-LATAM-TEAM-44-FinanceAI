# FinanceAI
#
#   docker compose up -d --build
#
#   Frontend      -> http://<host>:8081
#   API (Swagger) -> http://<host>:8080/swagger-ui.html
#
# El navegador habla con el frontend (:8081), que hace de proxy hacia la API.
# La API es la unica que llama al ml-service, y este el unico que carga los
# modelos.
#
# El ml-service NO publica puerto: solo se le llega desde la red interna del
# stack. Ademas de ser lo correcto, el 8000 suele estar ocupado (Portainer lo
# usa por defecto).
#
# Despliegue en OCI Compute: docs/DESPLIEGUE-OCI.md

services:
  ml-service:
    build:
      # Contexto en la raiz: la imagen necesita ciencia-datos/features.py.
      context: .
      dockerfile: srv-python/Dockerfile
    container_name: financeai-ml
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      # Descarga de modelos desde OCI Object Storage. Sin estas variables el
      # servicio usa los artefactos montados en el volumen de abajo.
      OCI_BUCKET: ${OCI_BUCKET:-}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_REGION: ${OCI_REGION:-}
      OCI_PREFIJO: ${OCI_PREFIJO:-}
      OCI_PAR_URL: ${OCI_PAR_URL:-}
    volumes:
      # Artefactos versionados en el repositorio, en solo lectura. Si se
      # configura OCI Object Storage, el servicio los descarga de ahi y este
      # volumen queda como respaldo.
      - ./ciencia-datos/artefactos:/srv/artefactos:ro

  api:
    build: ./srv-java
    container_name: financeai-api
    restart: unless-stopped
    ports:
      - "${PUERTO_API:-8080}:8080"
    environment:
      # Dentro de la red del stack el host es el nombre del servicio.
      ML_SERVICE_URL: http://ml-service:8000
      # El frontend llama a la API por el mismo origen a traves de su nginx,
      # asi que CORS solo hace falta si algun cliente externo la consume.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      # Archivado de analisis en Object Storage (opcional). Ver docs/OCI.md.
      OCI_PAR_URL: ${OCI_PAR_URL:-}
      OCI_BUCKET: ${OCI_BUCKET:-finance-ai-models}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_REGION: ${OCI_REGION:-}
    depends_on:
      ml-service:
        condition: service_healthy

  web:
    build: ./web
    container_name: financeai-web
    restart: unless-stopped
    ports:
      - "${PUERTO_WEB:-8081}:80"
    depends_on:
      - api
